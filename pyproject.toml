[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nava-tools"
version = "1.0.0"
description = "Build, flash and back up the Nava TR-909 replica over MIDI"
requires-python = ">=3.9"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
build = ["platformio>=6.1"]
dev = ["pytest>=7"]

[project.scripts]
nava = "nava.cli:main"

[tool.setuptools.packages.find]
include = ["nava*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
