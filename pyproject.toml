[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nava-tools"
version = "1.0.0"
description = "Build, flash and back up the Nava TR-909 replica over MIDI"
readme = "README.md"
license = "GPL-3.0-or-later"
# PEP 604 unions (`X | None`) appear in runtime-evaluated positions, and every
# module defers annotations, but 3.10 is the honest floor: only 3.13 is tested.
requires-python = ">=3.10"
keywords = ["midi", "sysex", "tr-909", "nava", "firmware", "drum-machine"]
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
build = ["platformio>=6.1"]

[project.urls]
Homepage = "https://github.com/jeanbrazeau/nava-tools"
Source = "https://github.com/jeanbrazeau/nava-tools"
# The firmware this drives, and where a release tag is cut.
Firmware = "https://github.com/jeanbrazeau/Nava-Firmware"

[project.scripts]
nava = "nava.cli:main"

[dependency-groups]
# uv installs this automatically for `uv run` / `uv sync`; it is deliberately not
# an extra, so nothing a user installs drags the test suite along.
dev = [
    "pytest>=7",
]

# The web app is not installed with the package: it is deployed to GitHub Pages
# from web/ and served from there. Shipping a copy in the wheel would put a
# second, staler version of the same tool on people's disks.
[tool.setuptools.packages.find]
include = ["nava*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
