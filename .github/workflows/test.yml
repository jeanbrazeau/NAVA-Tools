# Both suites run on every push: there is no hardware in CI, and there does not
# need to be - tests/fakenava.py and tests/web/fakenava.js model the device, so
# the transfer loops and the protocol are exercised on both sides without one.
#
# The Python versions are the floor and the ceiling of what pyproject declares.
# 3.10 is where `X | None` in a runtime-evaluated position would break first, and
# it is not the version anyone develops on, so it is the one that regresses
# silently.
#
# The two jobs are what keeps the web app honest: test_vectors.py checks that
# tests/fixtures/vectors.json still describes this package, and the node job
# checks that web/js reproduces the same fixture. Changing one implementation
# alone fails one of them.

name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # python-rtmidi ships manylinux wheels only for the interpreters that
      # existed when it was released, so the newest one in the matrix builds it
      # from source - and that build needs a MIDI backend's headers. Without
      # this the job fails on a meson error about ALSA, several screens deep,
      # which reads as nothing to do with this package at all.
      - name: MIDI backend headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # --locked rather than a plain sync: uv.lock is committed so the
      # environment is reproducible, and a lockfile that no longer satisfies
      # pyproject.toml should fail here rather than be silently updated.
      - name: Install
        run: uv sync --locked --python ${{ matrix.python }}

      - name: Test
        run: uv run --python ${{ matrix.python }} pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:test and ES modules only; the web app has no dependencies and no
      # build step, so there is nothing to install and nothing to lock.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: node --test "tests/web/*.test.js"
