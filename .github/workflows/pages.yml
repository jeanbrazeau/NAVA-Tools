# Publishes web/ to GitHub Pages.
#
# One-time setup in the repository: Settings -> Pages -> Source -> "GitHub
# Actions". Without that the workflow runs and the deploy step fails, because
# the branch-based Pages source ignores artifacts entirely.
#
# There is no build step. web/ is plain ES modules and one stylesheet, uploaded
# as it sits in the repository, so what the site serves is what is committed -
# no bundler output to diverge from the source, and `python3 -m http.server` in
# web/ is an exact local copy of production.
#
# PUBLISHED ON EVERY GREEN MASTER BUILD. The workflow_run trigger fires when
# Tests finishes on master and deploys only if it passed - the site talks to a
# bootloader, and a page that fails its own protocol vectors should not be the
# one people reach. It also still runs when someone presses "Run workflow" on
# the Actions tab, and when the firmware repository's release workflow
# dispatches it after committing a new image into web/firmware/.

name: Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Tests"]
    branches: [master]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half way: an interrupted deploy
# leaves the site on a mixed set of files.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The commit that passed, not whatever master has moved on to since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/configure-pages@v5

      # A release asset cannot be fetched cross-origin: api.github.com sends
      # `access-control-allow-origin: *` but the asset itself sends no such
      # header, so the page can look a release up and still not read its bytes.
      # Here there is no CORS, so the current image ships beside the page and
      # the Firmware panel is one click. Anything else falls back to a browser
      # download - see the note at the top of web/js/releases.js.
      #
      # web/firmware/ is normally already in the repository: the firmware
      # release workflow commits each published image here and dispatches this
      # deploy, so the checkout carries the current release and this step has
      # nothing to do. The download below is the fallback for a checkout with
      # no committed image - never overwrite a committed copy with a freshly
      # downloaded one, because a failed download here would then delete an
      # image that was fine.
      #
      # Never fails the deploy: a firmware repository with no releases yet, or a
      # GitHub hiccup, should publish a site without a bundled image rather than
      # no site at all.
      - name: Bundle the current firmware
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_REPO: jeanbrazeau/Nava-Firmware
        run: |
          set -u
          if [ -f web/firmware/index.json ]; then
            echo "using the committed image:"
            cat web/firmware/index.json
            exit 0
          fi
          mkdir -p web/firmware
          release=$(gh api "repos/$FIRMWARE_REPO/releases/latest" 2>/dev/null) || {
            echo "no published release in $FIRMWARE_REPO; deploying without one"
            exit 0
          }
          # Shortest .syx wins, the same rule the tool uses everywhere else:
          # firmware.syx over firmware-debug.syx.
          asset=$(echo "$release" | jq -c '[.assets[] | select(.name | endswith(".syx"))]
                                           | sort_by(.name | length) | first')
          if [ "$asset" = "null" ]; then
            echo "latest release publishes no .syx; deploying without one"
            exit 0
          fi
          name=$(echo "$asset" | jq -r .name)
          gh api -H "Accept: application/octet-stream" \
            "repos/$FIRMWARE_REPO/releases/assets/$(echo "$asset" | jq -r .id)" \
            > "web/firmware/$name"
          # The manifest is what the page reads; the size is checked against the
          # file on disk so a truncated download does not ship as a good image.
          got=$(wc -c < "web/firmware/$name" | tr -d ' ')
          want=$(echo "$asset" | jq -r .size)
          if [ "$got" != "$want" ]; then
            echo "::warning::$name downloaded as $got bytes, expected $want; deploying without it"
            rm -rf web/firmware
            exit 0
          fi
          jq -n --arg repo "$FIRMWARE_REPO" --arg file "$name" \
                --arg tag "$(echo "$release" | jq -r .tag_name)" \
                --arg name "$(echo "$release" | jq -r '.name // .tag_name')" \
                --arg published "$(echo "$release" | jq -r '.published_at // ""' | cut -c1-10)" \
                --argjson size "$want" \
                '{repo: $repo, tag: $tag, name: $name, published: $published, file: $file, size: $size}' \
            > web/firmware/index.json
          echo "bundled $name ($want bytes)"
          cat web/firmware/index.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
